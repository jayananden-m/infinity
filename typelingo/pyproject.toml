[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "typelingo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis[hiredis]>=5.0.0",
    "celery[redis]>=5.4.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.0",
    "httpx>=0.27.0",
    "groq>=0.9.0",
    "spacy>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
    "pre-commit>=3.7.0",
    "pip-audit>=2.7.0",
    "commitizen>=3.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes (unused imports, undefined names)
    "I",     # isort (import ordering)
    "UP",    # pyupgrade (modern Python syntax)
    "B",     # flake8-bugbear (common bug patterns)
    "N",     # pep8-naming (naming conventions)
    "S",     # flake8-bandit (security checks)
    "C90",   # mccabe (cyclomatic complexity)
    "SIM",   # flake8-simplify (simplifiable code)
    "TCH",   # flake8-type-checking (TYPE_CHECKING imports)
    "RUF",   # ruff-specific rules
    "PT",    # flake8-pytest-style
    "ASYNC", # flake8-async (async anti-patterns)
    "PL",    # pylint rules
    "TRY",   # tryceratops (exception handling)
    "DTZ",   # flake8-datetimez (timezone-aware datetimes)
    "ARG",   # flake8-unused-arguments
    "RET",   # flake8-return
    "G",     # flake8-logging-format
    "LOG",   # flake8-logging
]
ignore = [
    "B008",   # FastAPI uses function calls in default args (Depends)
    "TRY003", # Long exception messages are fine
    "S104",   # Binding to 0.0.0.0 is intentional inside Docker
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert statements are expected in tests
    "PLR2004", # magic values are acceptable in test assertions
    "ARG001",  # unused function arguments common with fixtures
    "ARG002",  # unused method arguments common with fixtures
    "E402",    # conftest.py sets env vars before app imports
]

[tool.ruff.lint.mccabe]
max-complexity = 10

# ---------------------------------------------------------------------------
# mypy — static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires live Postgres and Redis",
    "e2e: full user flow tests",
]

# ---------------------------------------------------------------------------
# commitizen — conventional commits + version bumping
# ---------------------------------------------------------------------------
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
